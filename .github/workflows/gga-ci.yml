name: GGA CI/CD Pipeline

on:
  pull_request:
    branches:
      - release/*
      - main
      - feat/tauri-ipc-frontend
  push:
    branches:
      - release/*
      - main
      - feat/tauri-ipc-frontend

env:
  RUST_VERSION: "1.80"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # =========================================================================
  # RUST BUILD & TEST (Ubuntu + Windows)
  # =========================================================================
  rust-build-test:
    name: Rust Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: MindLdger
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: MindLdger.exe
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          version: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          working-directory: src-tauri

      - name: Build Rust workspace
        working-directory: src-tauri
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --workspace --release --target ${{ matrix.target }}
