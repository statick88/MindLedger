name: GGA CI/CD Pipeline

on:
  pull_request:
    branches:
      - release/*
      - main
      - feat/tauri-ipc-frontend
  push:
    branches:
      - release/*
      - main
      - feat/tauri-ipc-frontend

env:
  RUST_VERSION: "1.80"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # =========================================================================
  # RUST BUILD & TEST (Ubuntu + Windows)
  # =========================================================================
  rust-build-test:
    name: Rust Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: MindLdger
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: MindLdger.exe
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          version: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          working-directory: src-tauri

      - name: Build Rust workspace
        working-directory: src-tauri
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --workspace --release --target ${{ matrix.target }}

  # =========================================================================
  # FRONTEND BUILD & TEST (Ubuntu)
  # =========================================================================
  frontend-build-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm run tsc --noEmit

      - name: Build frontend (Vite)
        run: pnpm run build

  # =========================================================================
  # TAURI APP BUILD (Multi-platform)
  # =========================================================================
  tauri-build:
    name: Tauri Build (${{ matrix.os }})
    needs: [rust-build-test, frontend-build-test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: MindLdger
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: MindLdger.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: MindLdger
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          version: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsqlite3-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "macOS build environment ready"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          working-directory: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "MindLdger v__VERSION__"
          releaseBody: "Release notes for v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          retention-days: 30

  # =========================================================================
  # MACOS NOTARIZATION (Post-build)
  # =========================================================================
  macos-notarize:
    name: macOS Notarization
    needs: tauri-build
    if: runner.os == 'macOS' && github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-macos-latest-x86_64-apple-darwin
          path: artifacts

      - name: Notarize .dmg
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target x86_64-apple-darwin --notarize

  # =========================================================================
  # RELEASE (Merge to main)
  # =========================================================================
  release:
    name: Create Release
    needs: [rust-build-test, frontend-build-test, tauri-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.ref_name }}
          name: "MindLdger Release v${{ github.ref_name }}"
          body: |
            Automated release from main branch.
            See CHANGELOG.md for details.
          draft: false
          prerelease: false
          generate_release_notes: true
