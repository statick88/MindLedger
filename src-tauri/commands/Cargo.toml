[package]
name = "soft-mindledger-commands"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tauri = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { workspace = true }
rust_decimal = "1.35"
rust_decimal_macros = "1.35"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
secrecy = { workspace = true }

soft-mindledger-domain = { path = "../domain" }
soft-mindledger-application = { path = "../application" }
soft-mindledger-infrastructure = { path = "../infrastructure" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
docx-rs = "0.4"
tempfile = "3"
regex = "1"
serde_json = "1.0"
