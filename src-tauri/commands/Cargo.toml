[package]
name = "soft-gloria-commands"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tauri = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["serde", "v4"] }

soft-gloria-domain = { path = "../domain" }
soft-gloria-application = { path = "../application" }
soft-gloria-infrastructure = { path = "../infrastructure" }
